[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "skillos"
version = "0.1.0"
description = "Skill OS — 个人 AI Skill 操作系统（CLI / daemon / MCP 三模式同一包）"
requires-python = ">=3.11"
readme = "CODEBUDDY.md"
dependencies = [
    # 入口 / CLI（02 §9：Python 3.13 + Typer）
    "typer>=0.12",
    "rich>=13",
    # API / 实时（FastAPI + Uvicorn 与 WebSocket 同进程）
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # ORM / 迁移
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # MCP（官方 SDK，stdio 传输）
    # 必须 <2：mcp 2.x 移除了 `mcp.server.fastmcp`（改名 MCPServer），
    # 本包 `skillos/mcp/server.py` 用的是 1.x 的 FastMCP API。不加上限则
    # 全新环境会拉到 2.x，import 期即 ModuleNotFoundError（实测 mcp 2.3.0）。
    "mcp>=1.2,<2",
    # 数据结构（`pydantic[email]` 拉入 email-validator：auth.py 用 EmailStr，
    # 缺它会在 `create_app()` import 期就崩；见 docs/10 §已知限制）
    "pydantic[email]>=2.7",
    # 跨平台文件锁（05 P0-3：禁用 fcntl / msvcrt）
    "filelock>=3.14",
    # frontmatter / sidecar 解析
    "pyyaml>=6.0",
    # daemon WS 客户端 / 上游 URL 检查
    "websockets>=12.0",
    "httpx>=0.27",
    # 云端认证（T4：JWT）
    "pyjwt>=2.8",
    # 结构化日志（T23：structlog + stdlib 桥接；`04 §6.2`）
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
skillos = "skillos.cli.main:app"
skillos-mcp = "skillos.mcp.server:main"

[tool.setuptools.packages.find]
include = ["skillos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008：Typer 的 Option/Argument 放默认参数位是官方惯用法
ignore = ["B008"]
