# Alembic config -- local SQLite and cloud Postgres share the same schema (04 §3.4).
# Migration scripts live only under data/migrations/versions/.
#
# NOTE: keep this file pure ASCII. configparser reads it with the *locale* encoding
# (cp936 on Chinese Windows) while the file is UTF-8, so any non-ASCII byte here
# makes `alembic upgrade` die with UnicodeDecodeError before it can read env.py.
# Chinese explanations belong in docs/ and in the migration files, not in this ini.
[alembic]
script_location = data/migrations
prepend_sys_path = .
# Real URL comes from SKILLOS_DB_URL (see env.py); this value is only a placeholder.
sqlalchemy.url = sqlite:///data/skillos.sqlite3

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
