# Alembic 配置 —— 本地 SQLite 与云端 Postgres 表结构同构（04 §3.4），
# 迁移脚本唯一存放在 data/migrations/versions/。
[alembic]
script_location = data/migrations
prepend_sys_path = .
# 实际 URL 由 env.py 从 SKILLOS_DB_URL 读取，此处仅为占位
sqlalchemy.url = sqlite:///data/skillos.sqlite3

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
